apiVersion: apps/v1
kind: Deployment
metadata:
  name: salope-frontend
  namespace: salope
  labels:
    app: salope-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salope-frontend
  template:
    metadata:
      labels:
        app: salope-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/salope-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
