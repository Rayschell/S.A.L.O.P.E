# Robots d'aperçu de liens (Discord, WhatsApp, Telegram…) : ils n'exécutent pas
# le JS de la SPA, on leur sert la page Open Graph générée par le backend.
# Liste à garder synchronisée avec ROBOT_APERCU dans vite.config.js.
map $http_user_agent $apercu_robot {
    default 0;
    "~*(discordbot|facebookexternalhit|facebot|whatsapp|telegrambot|slackbot|twitterbot|linkedinbot|skypeuripreview|applebot|iframely|embedly|redditbot|mastodon)" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend
    location /api/ {
        proxy_pass http://salope-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Formulaire public : page Open Graph pour les robots, SPA pour les humains
    location /dispo/ {
        add_header Vary User-Agent always;
        if ($apercu_robot) {
            rewrite ^/dispo/([^/]+)/?$ /api/public/polls/$1/apercu last;
        }
        # rewrite … break (et non try_files) : on reste dans ce bloc, donc le
        # Vary ci-dessus accompagne bien la SPA servie aux humains.
        rewrite ^ /index.html break;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
