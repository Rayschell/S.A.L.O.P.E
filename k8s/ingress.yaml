# Domaine configuré : planning.lateb.eu
# and adjust the certificate issuer name if needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salope-ingress
  namespace: salope
  annotations:
    # Traefik (default K3s ingress controller)
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # cert-manager — assumes a ClusterIssuer named "letsencrypt-prod" already exists
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - planning.lateb.eu
      secretName: salope-tls
  rules:
    - host: planning.lateb.eu
      http:
        paths:
          # API routes go directly to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: salope-backend
                port:
                  number: 8000
          # All other requests → frontend (SPA)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: salope-frontend
                port:
                  number: 80
