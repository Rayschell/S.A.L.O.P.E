apiVersion: batch/v1
kind: Job
metadata:
  name: salope-migrations
  namespace: salope
  annotations:
    # Run this job manually before deploying a new version:
    # kubectl apply -f k8s/migrations-job.yaml -n salope
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z salope-postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
      containers:
        - name: migrations
          image: your-registry/salope-backend:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salope-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://baruser:$(POSTGRES_PASSWORD)@salope-postgres:5432/salope"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: salope-secret
                  key: SECRET_KEY
            - name: ALLOWED_EMAIL_DOMAIN
              value: "lateb.eu"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
