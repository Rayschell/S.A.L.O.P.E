services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: baruser
      POSTGRES_PASSWORD: barpassword
      POSTGRES_DB: salope
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baruser -d salope"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://baruser:barpassword@postgres:5432/salope
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_EMAIL_DOMAIN: lateb.eu
      CORS_ORIGINS: http://localhost:3000
      FUZZY_MATCH_THRESHOLD: "90"
    volumes:
      # Hot-reload : le code source est monté en live
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://baruser:barpassword@postgres:5432/salope
      SECRET_KEY: dev-secret-key-change-in-production
      ALLOWED_EMAIL_DOMAIN: lateb.eu
    volumes:
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: alembic upgrade head
    restart: "no"   # job one-shot

  frontend:
    image: node:20-alpine
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # volume anonyme pour isoler node_modules du host
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
