name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baruser
          POSTGRES_PASSWORD: barpassword
          POSTGRES_DB: salope
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U baruser -d salope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://baruser:barpassword@localhost:5433/salope_test
      DATABASE_URL: postgresql://baruser:barpassword@localhost:5433/salope
      SECRET_KEY: ci-test-secret-key-32-chars-xxxxxxxxxxx
      ALLOWED_EMAIL_DOMAIN: lateb.eu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        run: pytest tests -v
