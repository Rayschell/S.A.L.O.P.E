apiVersion: apps/v1
kind: Deployment
metadata:
  name: salope-backend
  namespace: salope
  labels:
    app: salope-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: salope-backend
  template:
    metadata:
      labels:
        app: salope-backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z salope-postgres 5432; do
                echo "Waiting for postgres..."; sleep 2
              done
      containers:
        - name: backend
          image: your-registry/salope-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salope-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://baruser:$(POSTGRES_PASSWORD)@salope-postgres:5432/salope"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: salope-secret
                  key: SECRET_KEY
            - name: ALLOWED_EMAIL_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: salope-config
                  key: ALLOWED_EMAIL_DOMAIN
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: salope-config
                  key: CORS_ORIGINS
            - name: FUZZY_MATCH_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: salope-config
                  key: FUZZY_MATCH_THRESHOLD
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
